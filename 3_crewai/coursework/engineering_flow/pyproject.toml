[project]
name = "engineering_flow"
version = "0.1.0"
description = "engineering_flow using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[tools]==1.14.4"
]

[project.scripts]
kickoff = "engineering_flow.main:kickoff"
run_crew = "engineering_flow.main:kickoff"
plot = "engineering_flow.main:plot"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "flow"
