design_task:
  description: >
    Take the high level requirements for {system_name} and prepare a detailed design for your engineering team.
    Here are the requirements: {requirements}
    IMPORTANT: Only output the design in markdown format, laying out the module(s), classes, functions.
    Do not actually write any code. Function or method signatures only.
    You should assign work to the following engineers: backend_engineer, frontend_engineer, test_engineer.
    The backend_engineer should write the backend python code.
    The frontend_engineer should make a gradio app.
    The test_engineer should write unit tests for the backend module.
    All engineers on this team share the same sandbox directory; there is no directory structure, all files are in
    the same directory. Everything runs in a uv project with gradio installed.
    IMPORTANT: Use your Write Sandbox File tool to also save this design to a file named "design.md".
  expected_output: >
    A detailed design to achieve the requirements, identifying code structure, and assignments to the engineers.

code_task:
  description: >
    Write python code that implements the design for {system_name}, in order to achieve the requirements.
    Here are the requirements: {requirements}
  expected_output: >
    Python files written to the sandbox and tested that implement the design and achieve the requirements.
    IMPORTANT: Use your sandbox tools to write and check the code.
  context:
    - design_task

frontend_task:
  description: >
    Write a gradio UI in a module app.py that demonstrates the {system_name} backend code, as described in the design.
    Assume there is only 1 user, and have the UI be clean and professional.
    Then write a separate validation script (e.g. _validate.py) that imports app.py and confirms the Blocks object
    constructs without error, and run it via your sandbox tools.
    IMPORTANT: the validation script must NOT call `.launch()` — that would block until timeout. Just import and instantiate.
    Here are the requirements: {requirements}
  expected_output: >
    A gradio UI in module app.py written to the sandbox that demonstrates the functionality.
    The file should be ready so that it can be run as-is, in the same sandbox directory as the backend code.
    IMPORTANT: Use your sandbox tools to write and check the code.
  context:
    - code_task
    - design_task

test_task:
  description: >
    Write unit tests for the {system_name} backend module, in a single test file, using the stdlib `unittest` module.
    Do not write tests for app.py (the gradio frontend).
    Fix any errors in the backend code so that the unit tests pass. Keep working until all unit tests pass.
    Avoid making any changes that might break the gradio app in app.py.
    IMPORTANT: Use your Write Sandbox File tool to also save a summary of the test results to a file named "test_summary.md".
  expected_output: >
    A single test file that can be run to test the backend module.
    IMPORTANT: Use your sandbox tools to write and run the unit tests.
    Output a summary of the results of the unit tests.
  context:
    - code_task
    - design_task
